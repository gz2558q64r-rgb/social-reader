name: Inspect Civitai video (temporary)
on:
  push:
    branches: [civitai-view-147408536]
    paths: [".github/workflows/civitai-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install media tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --break-system-packages -q pillow
      - name: Inspect at 10fps
        run: |
          python3 - <<'PY'
          import urllib.request, subprocess, base64, json, os, io
          from PIL import Image,ImageDraw
          url='https://image.civitai.com/xG1nkqKTMzGDvpLrqFT7WA/0fd07c38-4026-4aeb-88d2-3dc8634abaed/original=true/0fd07c38-4026-4aeb-88d2-3dc8634abaed.mp4'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as s, open('/tmp/clip.mp4','wb') as f:
            import shutil
            shutil.copyfileobj(s,f)
          p=subprocess.run(['ffprobe','-v','quiet','-show_format','-of','json','/tmp/clip.mp4'],capture_output=True,text=True,check=True)
          duration=float(json.loads(p.stdout)['format']['duration'])
          print('DURATION',duration,flush=True)
          for start,end,fps in [(0,5,10),(5,duration,10),(7,duration,15)]:
            n=round((end-start)*fps)
            frames=[]
            for i in range(n):
              t=min(duration-0.06,start+(i+0.5)/fps)
              cmd=['ffmpeg','-loglevel','error','-ss',str(t),'-i','/tmp/clip.mp4','-frames:v','1','-vf','scale=168:-2','-q:v','6','-f','image2pipe','-vcodec','mjpeg','-']
              p=subprocess.run(cmd,capture_output=True,check=True)
              im=Image.open(io.BytesIO(p.stdout)).convert('RGB')
              frames.append((im,t))
            cols=10 if start<7 else 8
            rows=(len(frames)+cols-1)//cols
            w,h=168,321
            sheet=Image.new('RGB',(cols*w,rows*h),'#181818')
            draw=ImageDraw.Draw(sheet)
            for j,(im,t) in enumerate(frames):
              x=j%cols*w;y=j//cols*h
              sheet.paste(im,(x,y))
              draw.rectangle((x,y+298,x+w,y+321),fill='#000000')
              draw.text((x+4,y+301),f'{t:04.2f}s',fill='white')
            buff=io.BytesIO()
            sheet.save(buff,format='JPEG',quality=75,optimize=True)
            key=f'SHEET_{start:g}_{end:.2f}_{fps}'
            print(key+'_BASE64 '+base64.b64encode(buff.getvalue()).decode(),flush=True)
          PY
