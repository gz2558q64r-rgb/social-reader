name: Quick YouTube title and captions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-lookup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp youtube-transcript-api
      - uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: client
      - name: Search video and retrieve captions
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, pathlib, re, sys
          from youtube_transcript_api import YouTubeTranscriptApi
          job=json.loads(pathlib.Path("job.json").read_text())
          search=job["url"].split(":",1)[1] if job["url"].startswith("ytsearch") else job["url"]
          p=subprocess.run(["yt-dlp","--flat-playlist","--dump-single-json","ytsearch15:"+search],capture_output=True,text=True,timeout=160)
          print("SEARCH_STDERR:",p.stderr[-4000:],flush=True)
          if p.returncode: print("SEARCH_FAILED",p.returncode);sys.exit(0)
          data=json.loads(p.stdout); entries=data.get("entries",[])
          for e in entries[:15]:print("CANDIDATE:",e.get("id"),e.get("title"),flush=True)
          scored=[]
          for e in entries:
              t=e.get("title","").lower()
              score=4*("3大ブランド比較" in t)+3*("トレンチ" in t)+2*("見た目は似" in t)+2*("縫製のプロ" in t)+("バーバリー" in t)
              scored.append((score,e))
          if not scored: print("NO_RESULTS");sys.exit(0)
          scored.sort(key=lambda v:-v[0]);score,target=scored[0]
          if score<5: print("NO_CONFIDENT_MATCH");sys.exit(0)
          vid=target["id"]; url="https://www.youtube.com/watch?v="+vid
          print("MATCHED_VIDEO:",url, target.get("title"),"SCORE",score,flush=True)
          try:
              segs=YouTubeTranscriptApi().fetch(vid,languages=["ja","en"])
              transcript="\n".join(str(getattr(x,"text","")).strip() for x in segs)
              if transcript.strip():
                  print("TRANSCRIPT_SOURCE: youtube-transcript-api")
                  print("TRANSCRIPT_BEGIN\n"+transcript[:30000]+"\nTRANSCRIPT_END")
                  sys.exit(0)
          except Exception as exc:print("CAPTION_API_ERROR:",str(exc)[:900])
          p=subprocess.run(["yt-dlp","--skip-download","--write-subs","--write-auto-subs","--sub-langs","ja.*,en.*","--sub-format","vtt","-o","quick.%(ext)s",url],capture_output=True,text=True,timeout=160)
          print("SUBTITLE_RESULT:",p.returncode,p.stderr[-3000:])
          files=list(pathlib.Path(".").glob("quick.*.vtt"))
          if files:
              raw=files[0].read_text(errors="replace")
              lines=[re.sub(r"<[^>]+>","",line).strip() for line in raw.splitlines() if line.strip() and "-->" not in line and not line.startswith(("WEBVTT","Kind:","Language:"))]
              transcript="\n".join(lines)
              print("TRANSCRIPT_SOURCE: yt-dlp")
              print("TRANSCRIPT_BEGIN\n"+transcript[:30000]+"\nTRANSCRIPT_END")
          else:print("NO_CAPTIONS_AVAILABLE")
          PY
