name: Read social media

on:
  push:
    paths:
      - "job.json"
      - "reader.py"
      - "requirements.txt"
      - ".github/workflows/read.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Detect YouTube target
        id: target
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          job = json.loads(Path("job.json").read_text(encoding="utf-8"))
          host = urlparse(job.get("url", "").strip()).netloc.lower()
          is_youtube = "youtube.com" in host or "youtu.be" in host
          print(f"youtube={'true' if is_youtube else 'false'}")
          PY

      - name: Enable Cloudflare WARP for YouTube
        if: steps.target.outputs.youtube == 'true'
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: client

      - name: Verify WARP
        if: steps.target.outputs.youtube == 'true'
        shell: bash
        run: |
          trace="$(curl -fsS https://www.cloudflare.com/cdn-cgi/trace)"
          printf '%s\n' "$trace"
          grep -q '^warp=on$' <<< "$trace"

      - name: Read content
        run: python reader.py

      - name: Upload lightweight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-reader-result
          path: |
            output/result.json
            output/transcript.txt
            output/frame_*.jpg
            output/yt-dlp.log.txt
          if-no-files-found: warn
          retention-days: 3
