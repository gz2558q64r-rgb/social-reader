name: Social reader unit tests

on:
  push:
    paths:
      - "reader.py"
      - "whisper_worker.py"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "reader.py"
      - "whisper_worker.py"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependency
        run: python -m pip install youtube-transcript-api
      - name: Syntax check
        run: python -m py_compile reader.py whisper_worker.py tests/test_transcript_priority.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
